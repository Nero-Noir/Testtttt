<style>
/* Layout: Kopfzeile mit Schritten 1–4, links Werkzeugleiste, rechts die Halle als Zeichenfläche (Meter-Raster). */
:root{
  color-scheme:light;
  --bg:#f4f4f1; --surface:#ffffff; --surface-2:#f0efec; --surface-3:#e7e6e1;
  --text:#0b0b0b; --text-2:#52514e; --muted:#85847e; --border:#dedcd5;
  --accent:#2a78d6; --accent-ink:#ffffff;
  --good:#0f7b3f; --good-bg:#e3f3e8; --warn:#9a6700; --warn-bg:#fdf1d6; --crit:#c62f2f; --crit-bg:#fbe5e4;
  --canvas:#e6e8e5; --hall:#fbfbf9; --wall:#22221f; --gridc:rgba(30,30,25,.07); --gridm:rgba(30,30,25,.16);
  --worker:#2a78d6; --crew:#eb6834; --fork:#e2b000;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --surface-3:#2d2d2a;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8e86; --border:#34342f;
    --accent:#3987e5; --accent-ink:#ffffff;
    --good:#4cc47e; --good-bg:#16301f; --warn:#e2b04a; --warn-bg:#352a10; --crit:#ef6b6b; --crit-bg:#3a1818;
    --canvas:#151716; --hall:#1e201f; --wall:#e9e8e2; --gridc:rgba(240,240,230,.06); --gridm:rgba(240,240,230,.14);
    --worker:#6aa8f0; --crew:#f08a55; --fork:#f0c635;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --surface-3:#2d2d2a;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8e86; --border:#34342f;
  --accent:#3987e5; --accent-ink:#ffffff;
  --good:#4cc47e; --good-bg:#16301f; --warn:#e2b04a; --warn-bg:#352a10; --crit:#ef6b6b; --crit-bg:#3a1818;
  --canvas:#151716; --hall:#1e201f; --wall:#e9e8e2; --gridc:rgba(240,240,230,.06); --gridm:rgba(240,240,230,.14);
  --worker:#6aa8f0; --crew:#f08a55; --fork:#f0c635;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--surface);border-bottom:1px solid var(--border);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex:0 0 auto}
.hwrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding-top:10px}
.brand{font-weight:650;font-size:16px;margin-right:auto}
.brand small{display:block;font-weight:400;color:var(--text-2);font-size:12px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs{display:flex;gap:2px;overflow-x:auto}
nav.tabs button{border:0;background:none;color:var(--text-2);padding:10px 14px;font:inherit;font-weight:550;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
nav.tabs button .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--surface-3);font-size:11px;margin-right:6px}
nav.tabs button.on .n{background:var(--accent);color:var(--accent-ink)}
nav.tabs button:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.work{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:350px minmax(0,1fr)}
aside{overflow:auto;background:var(--surface);border-right:1px solid var(--border);padding:14px 14px 30px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.stage{position:relative;min-width:0;min-height:0;background:var(--canvas);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
h2{font-size:16px;margin:0}
h3{font-size:13px;margin:0 0 8px;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em;font-weight:650}
.sec{display:flex;flex-direction:column;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.sec:last-child{border-bottom:0}
p{margin:0}
.lead{color:var(--text-2);font-size:13px}
.hint{color:var(--muted);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.form{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.form label{color:var(--text-2);font-size:13px}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:7px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--crit)}
.btn.armed{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.on{outline:2px solid var(--accent);outline-offset:-1px;background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
input,select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:4px 6px;min-width:0}
input[type=number]{width:84px;text-align:right}
input[type=color]{width:26px;height:22px;padding:0;border:0;background:none;cursor:pointer}
input[type=range]{accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.drop{border:1.5px dashed var(--border);border-radius:10px;padding:16px;text-align:center;color:var(--text-2);cursor:pointer;background:var(--surface-2)}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.drop b{color:var(--text)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:4px 4px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-weight:600;color:var(--text-2);font-size:11px}
td.l,th.l{text-align:left;white-space:normal}
td input[type=number]{width:70px}
tr.sum td{font-weight:650;border-bottom:0}
.over{color:var(--crit);font-weight:650}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:99px;font-size:11px;font-weight:600;background:var(--surface-3);color:var(--text)}
.chip.ok{background:var(--good-bg);color:var(--good)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.crit{background:var(--crit-bg);color:var(--crit)}
.cat{display:flex;flex-direction:column;gap:4px}
.cat .grp{font-size:12px;font-weight:650;display:flex;align-items:center;gap:6px;margin-top:6px}
.cat .grp i{width:10px;height:10px;border-radius:3px;display:inline-block}
.cat .items{display:flex;flex-wrap:wrap;gap:4px}
.mbtn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:6px;padding:3px 7px;font:inherit;font-size:12px;cursor:pointer;text-align:left}
.mbtn small{color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.mbtn:hover{background:var(--surface-2)}
.mbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mbtn.on small{color:var(--accent-ink)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kpi{background:var(--surface-2);border-radius:8px;padding:7px 9px}
.kpi .v{font-size:18px;font-weight:650;font-variant-numeric:tabular-nums}
.kpi .t{font-size:11px;color:var(--text-2)}
.bar{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.log{font-size:12px;display:flex;flex-direction:column;gap:3px;max-height:200px;overflow:auto;font-variant-numeric:tabular-nums}
.log div{color:var(--text-2)} .log b{color:var(--text);font-weight:600;margin-right:6px}
.clock{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.ov{position:absolute;display:flex;gap:4px;z-index:2}
.ov.tr{top:10px;right:max(10px,env(safe-area-inset-right,0px))}
.ov.bl{bottom:10px;left:10px;right:10px;flex-wrap:wrap;pointer-events:none}
.ov .btn{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--text-2);background:color-mix(in srgb,var(--surface) 88%,transparent);border-radius:8px;padding:5px 9px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.legend i.sq{border-radius:2px}
#tip{position:absolute;pointer-events:none;z-index:3;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.18);max-width:260px}
#tip b{display:block}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:20;max-width:90vw}
.sel{background:var(--surface-2);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.sel .t{font-weight:650}
@media (max-width:860px){
  body{overflow:auto;display:block;height:auto}
  .work{display:flex;flex-direction:column}
  .stage{height:62vh;flex:0 0 auto}
  aside{border-right:0;overflow:visible;padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }

<body>
<header>
  <div class="hwrap">
    <div class="brand">Hallenlayout-Planer<small>Grundriss → Grob-Layout → Fein-Layout → Aufbau- und Produktionssimulation</small></div>
    <div class="tools">
      <button class="btn sm" id="bExport" type="button">Projekt exportieren</button>
      <button class="btn sm" id="bImport" type="button">Projekt importieren</button>
      <input type="file" id="fImport" accept=".json,application/json" hidden>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button type="button" data-tab="plan" class="on"><span class="n">1</span>Grundriss</button>
    <button type="button" data-tab="zones"><span class="n">2</span>Grob-Layout</button>
    <button type="button" data-tab="machines"><span class="n">3</span>Fein-Layout</button>
    <button type="button" data-tab="sim"><span class="n">4</span>Simulation</button>
  </nav>
</header>
<div class="work">
  <aside id="side"></aside>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="ov tr">
      <button class="btn sm" id="zIn" type="button" aria-label="Vergrößern">+</button>
      <button class="btn sm" id="zOut" type="button" aria-label="Verkleinern">−</button>
      <button class="btn sm" id="zFit" type="button">Einpassen</button>
    </div>
    <div class="ov bl" id="legend"></div>
    <div id="tip" hidden></div>
  </div>
</div>
<div id="toast" hidden></div>

<script>
'use strict';
/* ---------- Stammdaten ---------- */
const ZT={
  we:{n:'Wareneingang',c:'#2a78d6',p:.08,f:0},
  lager:{n:'Lager',c:'#6250d6',p:.15,f:1},
  prod:{n:'Produktion',c:'#eb6834',p:.26,f:2},
  mont:{n:'Montage',c:'#d6a10f',p:.14,f:3},
  qs:{n:'Qualitätssicherung',c:'#1baf7a',p:.05,f:4},
  vers:{n:'Versand',c:'#2fa3c4',p:.08,f:5},
  serv:{n:'Service & Instandhaltung',c:'#8a6d5a',p:.05,side:1},
  sozial:{n:'Büro & Sozialräume',c:'#c2549b',p:.07,side:1},
  weg:{n:'Verkehrsweg',c:'#8f8e86',p:0}
};
const ZK=Object.keys(ZT);
/* st = Stufe im Materialfluss, role: in/proc/store/out/sup/pause/home/fork, cyc = Taktzeit in min, wk = Werker, build = Aufbau in h */
const MT={
  torEin:{n:'Rolltor Anlieferung',k:'Tor',w:4,h:1.5,z:['we'],st:0,role:'in',wk:0,build:6,c:'#2a78d6'},
  wep:{n:'Wareneingangsprüfung',k:'WEP',w:3,h:2,z:['we'],st:1,role:'proc',cyc:4,wk:1,build:4,c:'#4b8fe0'},
  regal:{n:'Palettenregal',k:'Regal',w:9.6,h:1.2,z:['lager'],st:2,role:'store',wk:0,build:8,c:'#6250d6'},
  klt:{n:'Kleinteilelager',k:'KLT',w:4,h:1,z:['lager','mont'],st:2,role:'store',wk:0,build:5,c:'#7d6fe0'},
  cnc:{n:'CNC-Fräszentrum',k:'CNC',w:4,h:3,z:['prod'],st:3,role:'proc',cyc:14,wk:1,build:24,c:'#eb6834'},
  dreh:{n:'CNC-Drehmaschine',k:'Dreh',w:4,h:2.2,z:['prod'],st:3,role:'proc',cyc:10,wk:1,build:18,c:'#e0793f'},
  laser:{n:'Laserschneidanlage',k:'Laser',w:6,h:3,z:['prod'],st:3,role:'proc',cyc:8,wk:1,build:30,c:'#d4572a'},
  presse:{n:'Hydraulikpresse',k:'Presse',w:3,h:3,z:['prod'],st:3,role:'proc',cyc:6,wk:1,build:20,c:'#c9622f'},
  schweiss:{n:'Schweißroboterzelle',k:'Robo',w:5,h:4,z:['prod'],st:3,role:'proc',cyc:12,wk:1,build:28,c:'#b8502a'},
  mlinie:{n:'Montagelinie',k:'Linie',w:12,h:2.5,z:['mont'],st:4,role:'proc',cyc:5,wk:3,build:32,c:'#d6a10f'},
  mplatz:{n:'Montagearbeitsplatz',k:'MAP',w:3,h:2,z:['mont'],st:4,role:'proc',cyc:16,wk:1,build:4,c:'#c99a1c'},
  pruef:{n:'Funktionsprüfstand',k:'Prüf',w:3,h:3,z:['qs'],st:5,role:'proc',cyc:6,wk:1,build:12,c:'#1baf7a'},
  kmg:{n:'Messraum (KMG)',k:'KMG',w:4,h:4,z:['qs'],st:5,role:'proc',cyc:9,wk:1,build:16,c:'#16946a'},
  verpack:{n:'Verpackungsstation',k:'Pack',w:3,h:2,z:['vers'],st:6,role:'proc',cyc:5,wk:1,build:4,c:'#2fa3c4'},
  torAus:{n:'Versandtor / Rampe',k:'Tor',w:4,h:1.5,z:['vers'],st:7,role:'out',cyc:3,wk:0,build:6,c:'#2589a6'},
  werkbank:{n:'Werkstatt-Werkbank',k:'WB',w:3,h:1.2,z:['serv'],role:'sup',wk:1,build:2,c:'#8a6d5a'},
  ersatz:{n:'Ersatzteilschrank',k:'ET',w:2,h:1,z:['serv'],role:'sup',wk:0,build:1,c:'#9c806c'},
  kompressor:{n:'Druckluftkompressor',k:'DL',w:2.5,h:2,z:['serv'],role:'sup',wk:0,build:8,c:'#76604f'},
  buero:{n:'Büroarbeitsplatz',k:'Büro',w:2,h:1.6,z:['sozial'],role:'sup',wk:1,build:1,c:'#c2549b'},
  pause:{n:'Pausenraum',k:'Pause',w:6,h:4,z:['sozial'],role:'pause',wk:0,build:10,c:'#b04489'},
  umkleide:{n:'Umkleide & WC',k:'Umkl.',w:5,h:4,z:['sozial'],role:'home',wk:0,build:12,c:'#a33f7e'},
  stapler:{n:'Stapler-Ladeplatz',k:'Stapler',w:3,h:3,z:['weg','we','lager','vers'],role:'fork',wk:0,build:3,c:'#8f8e86'}
};
const AUTO={
  we:{list:['torEin','wep','torEin','wep','stapler'],lim:{torEin:2,wep:2,stapler:1},gu:2,gv:2},
  lager:{list:['regal'],lim:{},gu:.6,gv:3.4},
  prod:{list:['cnc','dreh','laser','schweiss','presse'],lim:{},gu:2,gv:2.5},
  mont:{list:['mlinie','mplatz','mplatz','klt'],lim:{mlinie:2,klt:2},gu:2,gv:2.5},
  qs:{list:['pruef','kmg','pruef'],lim:{kmg:1,pruef:3},gu:2,gv:2},
  vers:{list:['verpack','torAus','verpack','torAus','verpack'],lim:{torAus:2,verpack:3},gu:2,gv:2},
  serv:{list:['werkbank','kompressor','ersatz','werkbank','ersatz'],lim:{kompressor:1,werkbank:3,ersatz:2},gu:1,gv:1.5},
  sozial:{list:['umkleide','pause','buero','buero','buero','buero'],lim:{umkleide:1,pause:1,buero:8},gu:1,gv:1.5}
};
const STAGES=['Wareneingang','WE-Prüfung','Lager','Fertigung','Montage','Prüfung','Verpackung','Versand'];

/* ---------- Zustand ---------- */
const KEY='hallenlayout-v1';
let S, IMG=null, tab='plan', layoutVer=0;
function defaults(){return {planW:90,op:.55,outline:[],zones:[],machines:[],aisle:4,sideTop:true,reverse:false,targets:{},colors:{},shift:2,interval:4,crews:6,forks:6,example:false,nid:1,img:null};}
const snap=v=>Math.round(v*2)/2;
const fmt=(v,d=0)=>v.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const zc=t=>S.colors[t]||ZT[t].c;
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
const $=s=>document.querySelector(s);
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600);}
function save(){clearTimeout(save.t);save.t=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){try{const c={...S,img:null};localStorage.setItem(KEY,JSON.stringify(c));}catch(e2){}}},300);}
function changed(){layoutVer++;save();}

/* ---------- Geometrie ---------- */
function hall(){const o=S.outline;if(o.length<3)return null;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const p of o){x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y);}return {x:x0,y:y0,w:x1-x0,h:y1-y0};}
function polyArea(o){let a=0;for(let i=0;i<o.length;i++){const p=o[i],q=o[(i+1)%o.length];a+=p.x*q.y-q.x*p.y;}return Math.abs(a/2);}
function inPoly(x,y,o){let c=false;for(let i=0,j=o.length-1;i<o.length;j=i++){const a=o[i],b=o[j];if(((a.y>y)!==(b.y>y))&&(x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x))c=!c;}return c;}
function dims(m){const t=MT[m.t];return m.r?{w:t.h,h:t.w}:{w:t.w,h:t.h};}
function mrect(m){const d=dims(m);return {x:m.x,y:m.y,w:d.w,h:d.h};}
const overlap=(a,b,g=0)=>a.x<b.x+b.w+g&&b.x<a.x+a.w+g&&a.y<b.y+b.h+g&&b.y<a.y+a.h+g;
const inside=(a,z)=>a.x>=z.x-1e-6&&a.y>=z.y-1e-6&&a.x+a.w<=z.x+z.w+1e-6&&a.y+a.h<=z.y+z.h+1e-6;
function zoneOf(r){return S.zones.find(z=>inside(r,z));}
function zoneAt(x,y){for(let i=S.zones.length-1;i>=0;i--){const z=S.zones[i];if(x>=z.x&&x<=z.x+z.w&&y>=z.y&&y<=z.y+z.h)return z;}return null;}
function rectInHall(r){const o=S.outline;if(o.length<3)return true;return [[r.x,r.y],[r.x+r.w,r.y],[r.x,r.y+r.h],[r.x+r.w,r.y+r.h]].every(([x,y])=>inPoly(x,y,o)||onEdge(x,y,o));}
function onEdge(x,y,o){for(let i=0;i<o.length;i++){const a=o[i],b=o[(i+1)%o.length];const L=Math.hypot(b.x-a.x,b.y-a.y);if(!L)continue;const t=((x-a.x)*(b.x-a.x)+(y-a.y)*(b.y-a.y))/(L*L);if(t<-.001||t>1.001)continue;const d=Math.abs((b.x-a.x)*(a.y-y)-(a.x-x)*(b.y-a.y))/L;if(d<.05)return true;}return false;}
function checkPlace(t,r,x,y,ignoreId){const m={t,r,x,y};const R=mrect(m);
  if(!rectInHall(R))return {ok:false,msg:'Außerhalb der Halle'};
  for(const o of S.machines){if(o.id===ignoreId)continue;if(overlap(R,mrect(o)))return {ok:false,msg:'Überschneidet '+MT[o.t].n};}
  const z=zoneOf(R);if(!z)return {ok:true,warn:true,msg:'Liegt in keinem Bereich vollständig'};
  if(!MT[t].z.includes(z.t))return {ok:true,warn:true,msg:'Passt nicht zum Bereich '+ZT[z.t].n};

  const flow=ZK.filter(k=>ZT[k].f!=null&&T[k]>0).sort((a,b)=>ZT[a].f-ZT[b].f);const side=ZK.filter(k=>ZT[k].side&&T[k]>0);

/* ---------- Fein-Layout ---------- */
function genFine(){

}
function packZone(z,a){
  const m=1,horiz=z.w>=z.h,L=horiz?z.w:z.h,D=horiz?z.h:z.w;let u=m,v=m,rowD=0,i=0,fails=0,n=0;const cnt={};
  while(fails<a.list.length&&n<80){

    if(a.lim[k]!=null&&(cnt[k]||0)>=a.lim[k]){fails++;continue;}
    const A=MT[k].w,B=MT[k].h;let pu=u,pv=v,nr=false;
    if(pu+A>L-m){pu=m;pv=v+rowD+a.gv;nr=true;}

    const M=horiz?{t:k,r:0,x:snap(z.x+pu),y:snap(z.y+pv)}:{t:k,r:1,x:snap(z.x+pv),y:snap(z.y+pu)};
    const R=mrect(M);if(!rectInHall(R)||S.machines.some(o=>overlap(R,mrect(o)))){fails++;continue;}

function dock(m,off=0){const r=mrect(m),ai=SIM.ai;const cx=r.x+r.w/2,cy=r.y+r.h/2;
  if(!ai)return {x:cx+off,y:r.y+r.h+.7};
  if(ai.h)return {x:cx+off,y:cy<ai.c?r.y+r.h+.7:r.y-.7};return {x:cx<ai.c?r.x+r.w+.7:r.x-.7,y:cy+off};}
function center(r){return {x:r.x+r.w/2,y:r.y+r.h/2};}
function move(a,dt,sp){let d=sp*dt;while(d>0&&a.path.length){const p=a.path[0],dx=p.x-a.x,dy=p.y-a.y,L=Math.hypot(dx,dy);if(L<=d){a.x=p.x;a.y=p.y;a.path.shift();d-=L;}else{a.x+=dx/L*d;a.y+=dy/L*d;a.dir=Math.atan2(dy,dx);d=0;}}return !a.path.length;}
function simReset(){
  const ms=S.machines.map(m=>({...m,s:'plan',prog:0,inb:0,outb:0,res:0,inc:0,busy:0,busyT:0,okT:0,gen:0,done:0,crew:null}));
  SIM={t:360,run:false,ms,crews:[],workers:[],forks:[],log:[],ver:layoutVer,stats:new Array(8).fill(0),ai:null,startOk:null,lastDone:null};
  SIM.ai=aisle();
  const h=hall()||{x:0,y:0,w:10,h:10};
  const tor=ms.find(m=>m.t==='torEin');SIM.entry=tor?dock(tor):{x:h.x+2,y:h.y+h.h-2};
  const uk=ms.find(m=>m.t==='umkleide');const soz=S.zones.find(z=>z.t==='sozial');SIM.home=uk?dock(uk):soz?center(soz):SIM.entry;
  const pr=ms.find(m=>m.t==='pause');SIM.pause=pr?center(mrect(pr)):soz?center(soz):SIM.home;SIM.pauseR=pr?mrect(pr):soz||null;
  const park=ms.filter(m=>m.t==='stapler');const nf=Math.max(1,S.forks||6);
  for(let i=0;i<nf;i++){const pk=park[i%Math.max(1,park.length)];const p=pk?center(mrect(pk)):{x:SIM.entry.x+i*1.5,y:SIM.entry.y};SIM.forks.push({id:i+1,x:p.x,y:p.y,park:{x:p.x+(i%2?.6:-.6),y:p.y},path:[],st:'idle',load:false,dir:0});}
  for(let i=0;i<S.crews;i++)SIM.crews.push({id:i+1,x:SIM.entry.x+i,y:SIM.entry.y,path:[],st:'idle',m:null,ph:Math.random()*6});
  SIM.order=[...ms].filter(m=>true).sort((a,b)=>stageOrder(a)-stageOrder(b)||a.x-b.x||a.y-b.y);
  log('Simulation bereit: '+ms.length+' Anlagen, '+S.crews+' Bautrupps');

function stageOrder(m){const t=MT[m.t];if(t.role==='home'||t.role==='pause')return -2;if(t.role==='fork')return -1;return t.st!=null?t.st:9;}
function log(msg){if(!SIM)return;SIM.log.unshift({t:SIM.t,msg});if(SIM.log.length>80)SIM.log.pop();SIM.logDirty=true;}
function clock(t){const d=Math.floor(t/1440)+1,md=t%1440;return `Tag ${d}, ${String(Math.floor(md/60)).padStart(2,'0')}:${String(Math.floor(md%60)).padStart(2,'0')}`;}
function stateText(m){if(m.s==='plan')return 'geplant';if(m.s==='bau')return (m.prog<.3?'Fundament':m.prog<.8?'Montage':'Inbetriebnahme')+' '+Math.round(m.prog*100)+' %';const t=MT[m.t];
  if(t.role==='proc'||t.role==='out'){if(m.busy>0)return m.present<1&&t.wk?'pausiert (kein Werker)':'produziert';if(t.wk&&m.present<1)return 'wartet auf Werker';if(m.inb<1)return 'wartet auf Material';if(m.outb>=3)return 'Ausgang voll';return 'bereit';}
  if(t.role==='in')return 'Anlieferung';if(t.role==='store')return `Bestand ${m.inb+m.outb}`;return 'in Betrieb';}
function cap(m){const r=MT[m.t].role;return r==='store'?40:r==='out'?10:3;}
function nextTargets(src){const s=MT[src.t].st;let best=null;for(let st=s+1;st<=7;st++){const c=SIM.ms.filter(m=>m.s==='ok'&&MT[m.t].st===st&&MT[m.t].role!=='in');if(c.length){best=c;break;}}return best;}
function findJob(f){let job=null,bd=1e9;
  for(const m of SIM.ms){if(m.s!=='ok')continue;const t=MT[m.t];if(t.st==null||t.role==='out')continue;if(m.outb-m.res<=0)continue;
    const tg=nextTargets(m);if(!tg)continue;let dst=null,lv=1e9;for(const d of tg){const l=d.inb+d.inc;if(l<cap(d)&&l<lv){lv=l;dst=d;}}if(!dst)continue;
    const p=dock(m);const d=Math.hypot(p.x-f.x,p.y-f.y)+t.st*-3;if(d<bd){bd=d;job={src:m,dst};}}
  return job;}
function step(dt){
  const t=SIM.t;SIM.t+=dt;const on=shiftOn(t),br=breakOn(t);
  /* Aufbau */
  for(const c of SIM.crews){
    if(c.gone)continue;
    if(c.st==='idle'){const m=SIM.order.find(x=>x.s==='plan');
      if(!m){if(!c.leaving){c.leaving=true;c.path=route(c,SIM.entry);}if(move(c,dt,70))c.gone=true;continue;}
      m.s='bau';m.crew=c;c.m=m;c.st='go';const r=mrect(m);c.path=route(c,dock(m));log(`Bautrupp ${c.id} beginnt: ${MT[m.t].n}`);}
    if(c.st==='go'){if(move(c,dt,70))c.st='build';}
    else if(c.st==='build'){const m=c.m;m.prog+=dt/(MT[m.t].build*60);c.ph+=dt*.6;
      if(m.prog>=1){m.prog=1;m.s='ok';m.crew=null;c.st='idle';c.m=null;log(`${MT[m.t].n} in Betrieb genommen`);if(!SIM.startOk)SIM.startOk=SIM.t;spawnWorkers(m);
        if(SIM.ms.every(x=>x.s==='ok')){SIM.lastDone=SIM.t;log('Aufbau abgeschlossen – alle Anlagen produzieren');}}}
  }
  /* Werker */
  for(const w of SIM.workers){const tgt=!on?'home':br?'pause':'work';
    if(w.tgt!==tgt){w.tgt=tgt;w.at=false;w.hidden=false;const sp=tgt==='home'?SIM.home:tgt==='pause'?w.pp:w.ws;w.path=route(w,sp);}
    if(!w.at&&move(w,dt,80)){w.at=true;if(tgt==='home')w.hidden=true;}}
  for(const m of SIM.ms)m.present=0;
  for(const w of SIM.workers)if(w.tgt==='work'&&w.at)w.m.present++;
  /* Anlagen */
  for(const m of SIM.ms){if(m.s!=='ok')continue;const T=MT[m.t];if(on)m.okT+=dt;
    if(T.role==='in'){const md=t%1440;if(md>=360&&md<1200){m.gen+=dt;if(m.gen>=S.interval&&m.outb<6){m.gen=0;m.outb++;SIM.stats[0]++;}}}
    else if(T.role==='store'){if(m.inb>0){m.outb+=m.inb;m.inb=0;}}
    else if(T.role==='proc'||T.role==='out'){const rate=T.wk?Math.min(1,m.present/T.wk):1;
      if(m.busy>0){if(rate>0){m.busy-=dt*rate;m.busyT+=dt;}if(m.busy<=0){m.busy=0;m.done++;SIM.stats[T.st]++;if(T.role==='proc')m.outb++;}}
      if(m.busy<=0&&m.inb>0&&rate>0&&(T.role==='out'||m.outb<3)){m.inb--;m.busy=T.cyc;}}}
  /* Stapler */
  for(const f of SIM.forks){
    if(f.st==='idle'){const j=findJob(f);if(j){f.src=j.src;f.dst=j.dst;j.src.res++;j.dst.inc++;f.st='toSrc';f.path=route(f,dock(f.src,.8));}
      else if(!f.path.length&&Math.hypot(f.x-f.park.x,f.y-f.park.y)>.5)f.path=route(f,f.park);else move(f,dt,120);}
    if(f.st==='toSrc'){if(move(f,dt,150)){f.st='load';f.w=1;}}
    else if(f.st==='load'){f.w-=dt;if(f.w<=0){f.src.outb--;f.src.res--;f.load=true;f.st='toDst';f.path=route(f,dock(f.dst,-.8));}}
    else if(f.st==='toDst'){if(move(f,dt,150)){f.st='unload';f.w=1;}}
    else if(f.st==='unload'){f.w-=dt;if(f.w<=0){f.dst.inb++;f.dst.inc--;f.load=false;f.st='idle';}}
  }
}
function spawnWorkers(m){const T=MT[m.t];for(let i=0;i<T.wk;i++){const off=(i-(T.wk-1)/2)*1.1;const pr=SIM.pauseR;
  const pp=pr?{x:pr.x+.8+Math.random()*(pr.w-1.6),y:pr.y+.8+Math.random()*(pr.h-1.6)}:SIM.pause;
  SIM.workers.push({x:SIM.home.x,y:SIM.home.y,path:[],m,ws:dock(m,off),pp,tgt:null,at:false,hidden:true});}}
function skipBuild(){if(!SIM)simReset();for(const m of SIM.ms){if(m.s!=='ok'){m.s='ok';m.prog=1;spawnWorkers(m);}}for(const c of SIM.crews)c.gone=true;SIM.lastDone=SIM.t;log('Aufbau übersprungen – alle Anlagen betriebsbereit');simSide();}
let lastT=0,uiT=0;
function frame(ts){const dtr=Math.min(.1,(ts-lastT)/1000||0);lastT=ts;

  for(const c of SIM.crews){if(c.gone)continue;for(let k=0;k<2;k++){let ox=k?.7:-.7,oy=0;if(c.st==='build'){const r=mrect(c.m);ox+=Math.sin(c.ph+k*2)*Math.min(1.2,r.w/3);oy=Math.cos(c.ph*1.3+k)*.3;}const [x,y]=w2s(c.x+ox,c.y+oy);ctx.fillStyle=COL.crew;ctx.beginPath();ctx.arc(x,y,R,0,7);ctx.fill();ctx.fillStyle='#ffd23a';ctx.beginPath();ctx.arc(x,y,R*.5,0,7);ctx.fill();}}}

function simUi(){if(!SIM)return;const ms=SIM.ms;const ok=ms.filter(m=>m.s==='ok').length;

  const days=Math.max(1/24,(SIM.t-360)/1440);const pres=SIM.workers.filter(w=>w.tgt==='work'&&w.at).length;
  const wip=ms.reduce((s,m)=>s+m.inb+m.outb,0)+SIM.forks.filter(f=>f.load).length;
  const K=[[SIM.stats[0],'Ladungen angeliefert'],[SIM.stats[3],'Teile gefertigt'],[SIM.stats[4],'Baugruppen montiert'],[SIM.stats[5],'geprüft'],[SIM.stats[7],'versendet'],[fmt(SIM.stats[7]/days,1),'Versand je Tag'],
    [`${pres} / ${SIM.workers.length}`,'Werker an der Anlage'],[fmt(util*100)+' %','Auslastung Fertigung & Montage'],[SIM.forks.filter(f=>f.st!=='idle').length+' / '+SIM.forks.length,'Stapler im Einsatz'],[wip,'Material im Umlauf']];

side.addEventListener('dragleave',e=>{const d=e.target.closest('#drop');if(d)d.classList.remove('over');});
side.addEventListener('drop',e=>{const d=e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');loadFile(e.dataTransfer.files[0]);}});
$('#stage').addEventListener('dragover',e=>e.preventDefault());
$('#stage').addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files[0]){setTab('plan');loadFile(e.dataTransfer.files[0]);}});

function setTab(t){tab=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  if(t!=='plan')tracing=null;if(t!=='machines'){ghost=null;ghostPos=null;}
  if(t==='sim'&&(!SIM||SIM.ver!==layoutVer)){simReset();SIM.speed=30;}
  if(SIM&&t!=='sim')SIM.run=false;
  try{localStorage.setItem(KEY+'-tab',t);}catch(e){}
  renderSide();}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setTab(b.dataset.tab);});

/* Export / Import */
$('#bExport').onclick=()=>{try{const blob=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hallenlayout.json';document.body.appendChild(a);a.click();a.remove();toast('Projekt exportiert.');}catch(e){toast('Export ist hier nicht möglich.');}};
$('#bImport').onclick=()=>$('#fImport').click();
$('#fImport').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(txt=>{const d=JSON.parse(txt);S={...defaults(),...d};IMG=null;const done=()=>{changed();fit();renderSide();toast('Projekt importiert.');};if(S.img)setImage(S.img,done);else done();}).catch(()=>toast('Die Datei ist kein gültiges Projekt.'));e.target.value='';};

/* Start */
(function init(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  try{const t=localStorage.getItem(KEY+'-tab');if(t)tab=t;}catch(e){}
  if(d&&d.outline){S={...defaults(),...d};const go=()=>{fit();setTab(tab);};if(S.img)setImage(S.img,go);else go();}
  else{loadExample();setTab(tab);}
  requestAnimationFrame(frame);})();
</script>
</body>
</html>
