<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kapazitätsplanung Studio</title>
<style>
:root{
  color-scheme:light;
  --bg:#f5f5f7; --surface:#ffffff; --surface-2:#f5f5f7; --surface-3:#e8e8ed;
  --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.08);
  --text:#1d1d1f; --text-2:#6e6e73; --muted:#86868b; --border:rgba(0,0,0,.09); --border-strong:rgba(0,0,0,.16);
  --accent:#0071e3; --accent-hover:#0077ed; --accent-soft:rgba(0,113,227,.10); --accent-ink:#fff;
  --good:#1a7f37; --good-bg:#e8f5ec; --warn:#a35200; --warn-bg:#fff4e0; --crit:#d70015; --crit-bg:#fdecee;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --grid:#ececf0; --axis:#c7c7cc;
  --ramp-bg:rgba(235,104,52,.16); --ser-bg:rgba(42,120,214,.14);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.05);
  --shadow-lg:0 12px 40px rgba(0,0,0,.12);
  --bar-bg:rgba(251,251,253,.78);
  --radius:18px; --radius-sm:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --surface-3:#3a3a3c;
    --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.16);
    --text:#f5f5f7; --text-2:#a1a1a6; --muted:#8e8e93; --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.2);
    --accent:#0a84ff; --accent-hover:#409cff; --accent-soft:rgba(10,132,255,.18);
    --good:#30d158; --good-bg:#11301b; --warn:#ffb340; --warn-bg:#3a2a0e; --crit:#ff6961; --crit-bg:#3d1614;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
    --grid:#2c2c2e; --axis:#48484a;
    --ramp-bg:rgba(217,89,38,.26); --ser-bg:rgba(57,135,229,.24);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.35);
    --bar-bg:rgba(22,22,23,.78);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --surface-3:#3a3a3c;
  --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.16);
  --text:#f5f5f7; --text-2:#a1a1a6; --muted:#8e8e93; --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.2);
  --accent:#0a84ff; --accent-hover:#409cff; --accent-soft:rgba(10,132,255,.18);
  --good:#30d158; --good-bg:#11301b; --warn:#ffb340; --warn-bg:#3a2a0e; --crit:#ff6961; --crit-bg:#3d1614;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
  --grid:#2c2c2e; --axis:#48484a;
  --ramp-bg:rgba(217,89,38,.26); --ser-bg:rgba(57,135,229,.24);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.35);
  --bar-bg:rgba(22,22,23,.78);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
.num,td.n,th.n{font-variant-numeric:tabular-nums}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:var(--bar-bg);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--border)}
.topbar-in{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 24px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;white-space:nowrap}
.brand-mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#0a84ff,#5e5ce6);display:grid;place-items:center;color:#fff}
.brand small{display:block;font-weight:400;color:var(--text-2);font-size:12px;line-height:1.1}
.tabs{flex:1;display:flex;justify-content:center;min-width:0}
.seg{display:inline-flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;transition:background .2s,box-shadow .2s}
.seg button:hover{background:var(--fill-2)}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#636366}}
.seg button .k{color:var(--muted);font-size:11px;margin-right:6px;font-weight:600}
.seg.sm button{padding:4px 10px;font-size:12.5px}
.actions{display:flex;gap:6px}
.icon-btn{width:34px;height:34px;border-radius:50%;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--text)}
.icon-btn:hover{background:var(--fill)}
.icon-btn svg{width:18px;height:18px}

/* ---------- Layout ---------- */
main{max-width:1440px;margin:0 auto;padding:28px 24px 80px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:8px 0 22px}
.eyebrow{font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
h1{font-size:40px;line-height:1.08;font-weight:700;letter-spacing:-.025em;margin:4px 0 6px}
.lede{color:var(--text-2);font-size:17px;max-width:760px;margin:0}
h2{font-size:21px;font-weight:600;letter-spacing:-.015em;margin:0}
h3{font-size:15px;font-weight:600;margin:0}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;margin-bottom:20px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card-h p{margin:2px 0 0;color:var(--text-2);font-size:13px}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid>.card{margin-bottom:0}
.stack>*+*{margin-top:20px}
.muted{color:var(--muted)} .t2{color:var(--text-2)}
.small{font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--fill-2);color:var(--text-2);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:12px 16px;margin-bottom:20px;font-size:14px}
.banner.warn{background:var(--warn-bg);color:var(--warn)} .banner.good{background:var(--good-bg);color:var(--good)} .banner.info{background:var(--accent-soft);color:var(--accent)}
.banner b{font-weight:600}

/* ---------- KPI tiles ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--surface);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.kpi .l{font-size:12.5px;color:var(--text-2);font-weight:500}
.kpi .v{font-size:28px;font-weight:650;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}

/* ---------- Forms ---------- */
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px 18px}
.field label,.flabel{display:block;font-size:12.5px;color:var(--text-2);font-weight:500;margin-bottom:5px}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.inp,select.inp{width:100%;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);padding:0 11px;outline:none;transition:border .15s,box-shadow .15s,background .15s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);background:var(--surface)}
.inp:disabled{opacity:.45}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{opacity:.4}
.unit{position:relative}
.unit .inp{padding-right:46px}
.unit span{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 16px;border-radius:999px;border:0;cursor:pointer;font-size:14px;font-weight:500;background:var(--fill);color:var(--text);white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink)} .btn.primary:hover{background:var(--accent-hover)}
.btn.ghost{background:transparent;color:var(--accent);padding:0 8px} .btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{height:28px;padding:0 12px;font-size:13px}
.btn svg{width:15px;height:15px}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;user-select:none}
.switch input{appearance:none;-webkit-appearance:none;width:42px;height:25px;border-radius:999px;background:var(--surface-3);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked{background:#34c759} .switch input:checked::after{transform:translateX(17px)}
.section-title{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.section-title .n{width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:700}
.method-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mcard{border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;cursor:pointer;background:var(--surface);text-align:left;transition:border .15s,box-shadow .15s}
.mcard:hover{border-color:var(--border-strong)}
.mcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.mcard h3{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mcard p{margin:6px 0 0;font-size:12.5px;color:var(--text-2)}

/* ---------- Tables ---------- */
.tbl-wrap{overflow:auto;border-radius:12px;border:1px solid var(--border);max-width:100%}
table.tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.tbl th,.tbl td{padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap;text-align:left;background:var(--surface)}
.tbl thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);font-weight:600;font-size:12px;color:var(--text-2)}
.tbl td.n,.tbl th.n{text-align:right}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--fill-2)}
.tbl .grp td{background:var(--surface-2);font-weight:600;font-size:12px;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em}
.tbl tr.total td{font-weight:600;background:var(--surface-2)}
.tbl tr.ghost td{color:var(--muted);font-style:italic;background:var(--fill-2)}
.tbl .sticky{position:sticky;left:0;z-index:1}
.tbl thead .sticky{z-index:3}
.tbl .sticky2{position:sticky;z-index:1}
.tbl input.cell{width:100%;min-width:74px;height:28px;border:1px solid transparent;border-radius:7px;background:transparent;text-align:right;padding:0 7px;font-variant-numeric:tabular-nums;outline:none}
.tbl input.cell.l{text-align:left;min-width:120px}
.tbl input.cell::-webkit-inner-spin-button,.tbl input.cell::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.tbl input.cell:hover{border-color:var(--border)}
.tbl input.cell:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.tbl input.cell.ov{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tbl select.cell{height:28px;border:1px solid var(--border);border-radius:7px;background:var(--surface-2);padding:0 6px;font-size:12.5px}
.tbl select.cell.ov{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
.param-tbl td:first-child{color:var(--text-2);min-width:220px}
.param-tbl th.type-h{min-width:150px}
.type-head{display:flex;align-items:center;gap:8px;justify-content:space-between}
.type-head input{font-weight:600;color:var(--text)}
.xbtn{border:0;background:transparent;color:var(--muted);cursor:pointer;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none}
.xbtn:hover{background:var(--crit-bg);color:var(--crit)}
.heat td.c{text-align:right;font-size:11.5px;min-width:52px;padding:6px 7px}
.heat td.c.r{background:var(--ramp-bg)} .heat td.c.s{background:var(--ser-bg)}
.heat th.c{text-align:right;font-size:11px;padding:6px 7px}
.heat th.ys,.heat td.ys{border-left:2px solid var(--border-strong)}
td.bad{color:var(--crit);font-weight:600} td.ok{color:var(--good)}

/* ---------- Charts ---------- */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:4px 6px;margin-bottom:10px}
.legend button{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;font-size:12.5px;color:var(--text-2);cursor:pointer;padding:3px 8px;border-radius:999px}
.legend button:hover{background:var(--fill-2)}
.legend button.off{opacity:.38}
.legend .sw{width:12px;height:4px;border-radius:2px}
.legend .sw.bar{height:10px;width:10px;border-radius:3px}
.tip{position:absolute;pointer-events:none;z-index:20;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:9px 11px;font-size:12.5px;min-width:160px;opacity:0;transition:opacity .1s}
.tip .h{font-weight:600;margin-bottom:5px}
.tip .r{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tip .r span:first-child{display:flex;align-items:center;gap:6px;color:var(--text-2)}
.tip .r b{font-weight:600;font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;margin-bottom:20px;background:var(--surface);border-radius:16px;padding:12px 16px;box-shadow:var(--shadow)}
.filters .f{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-2)}
.season-prev{display:flex;align-items:flex-end;gap:4px;height:46px;margin-top:10px}
.season-prev div{flex:1;background:var(--s1);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.gantt-wrap{overflow:auto;border-radius:12px;border:1px solid var(--border)}
.gantt text{font-size:11px;fill:var(--text-2)}
.gantt .lbl{fill:var(--text);font-size:12px}
.legend-static{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2);margin-bottom:12px}
.legend-static span{display:inline-flex;align-items:center;gap:6px}
.legend-static i{width:14px;height:10px;border-radius:3px;display:inline-block}
.formula{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12.5px;background:var(--surface-2);border-radius:10px;padding:10px 14px;color:var(--text-2);overflow-x:auto}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:all .25s;z-index:100;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.menu{position:absolute;right:16px;top:52px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);border:1px solid var(--border);padding:6px;min-width:230px;display:none;z-index:60}
.menu.open{display:block}
.menu button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:transparent;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:14px;text-align:left}
.menu button:hover{background:var(--fill-2)}
.menu hr{border:0;border-top:1px solid var(--border);margin:5px 4px}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .topbar-in{flex-wrap:wrap;padding:8px 16px;gap:8px}
  .tabs{order:3;flex-basis:100%;justify-content:flex-start}
  .brand small{display:none}
  .actions{margin-left:auto}
  main{padding:18px 16px 60px}
  h1{font-size:30px}
  .lede{font-size:15px}
  .g2,.g3,.g4,.method-cards{grid-template-columns:minmax(0,1fr)}
  .card{padding:18px 16px}
}
@media print{
  .topbar,.no-print,.filters{display:none!important}
  body{background:#fff}
  .card,.kpi{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  main{padding:0}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></div>
      <div>Kapazitätsplanung<small id="brandProject">Studio</small></div>
    </div>
    <nav class="tabs"><div class="seg" id="tabs" role="tablist"></div></nav>
    <div class="actions">
      <button class="icon-btn" id="themeBtn" title="Erscheinungsbild wechseln" aria-label="Erscheinungsbild wechseln">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn" id="menuBtn" title="Datei" aria-label="Menü">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      </button>
    </div>
  </div>
  <div class="menu" id="menu">
    <button data-act="export">Planung exportieren (JSON)</button>
    <button data-act="import">Planung importieren …</button>
    <button data-act="csv">Monatsdaten als CSV</button>
    <button data-act="print">Aktuelles Blatt drucken</button>
    <hr>
    <button data-act="reset" style="color:var(--crit)">Auf Beispieldaten zurücksetzen</button>
  </div>
  <input type="file" id="fileIn" accept="application/json,.json" hidden>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* =====================================================================
   Kapazitätsplanung Studio – Rechenkern
   ===================================================================== */
const MON = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const MON_L = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const PRE = 36;            // Monate vor Planungsbeginn, in denen SOPs liegen dürfen
const METHODS = {
  classic:  { name:'Klassische Terminierung', short:'Klassisch',
              desc:'Rückwärtsterminierung je Monat: Jede Anlage ist genau dann voll hochgefahren, wenn der Bedarf sie erfordert. Kein Vorratsaufbau.' },
  heuristic:{ name:'Heuristik Vorproduktion', short:'Heuristik',
              desc:'Greedy-Glättung: Spitzen werden durch Vorproduktion bis zur max. Lagerreichweite abgefangen. Neue Anlagen so spät wie möglich.' },
  robust:   { name:'Robuste Planung', short:'Robust',
              desc:'Klassische Terminierung auf einen Bedarf mit Sicherheitsaufschlag (Servicegrad × Absatz- und OEE-Schwankung) inkl. Sicherheitsbestand.' }
};
const METHOD_KEYS = ['classic','heuristic','robust'];

/* ---------- Zeitachse ---------- */
const startMonth = s => s.yearMode === 'calendar' ? 1 : (+s.fiscalStart || 1);
function idxDate(s, i){ const t = s.startYear*12 + startMonth(s) - 1 + i; return { y:Math.floor(t/12), m:((t%12)+12)%12 + 1 }; }
const mkey = (y,m) => y + '-' + String(m).padStart(2,'0');
function idxKey(s,i){ const d = idxDate(s,i); return mkey(d.y,d.m); }
function keyToIdx(s,k){ const [y,m] = k.split('-').map(Number); return y*12 + m - 1 - (s.startYear*12 + startMonth(s) - 1); }
function monthLabel(s,i,long){ const d = idxDate(s,i); return long ? MON_L[d.m-1]+' '+d.y : MON[d.m-1]+' '+String(d.y).slice(2); }
function yearLabel(s,yi){
  const y = s.startYear + yi;
  if (startMonth(s) === 1) return String(y);
  return 'GJ ' + y + '/' + String((y+1)%100).padStart(2,'0');
}
function yearRangeLabel(s,yi){ return monthLabel(s,yi*12,true) + ' – ' + monthLabel(s,yi*12+11,true); }

/* ---------- Kalender / Arbeitstage ---------- */
const wdCache = new Map();
function workdays(s, y, m, dpw){
  const k = y+'|'+m+'|'+dpw+'|'+s.holidays+'|'+s.vacDays+'|'+s.vacMonth;
  if (wdCache.has(k)) return wdCache.get(k);
  const n = new Date(y, m, 0).getDate(); let c = 0;
  for (let d=1; d<=n; d++){ let wd = new Date(y, m-1, d).getDay(); wd = wd===0 ? 7 : wd; if (wd <= dpw) c++; }
  const hol = (+s.holidays||0)/12 * Math.min(dpw,5)/5;
  const vac = (+s.vacMonth === m) ? Math.min(+s.vacDays||0, c) : 0;
  const r = Math.max(0, c - hol - vac);
  wdCache.set(k, r); return r;
}

/* ---------- Statistik / Zufall ---------- */
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function normalGen(rng){ let spare = null; return () => { if (spare !== null){ const v = spare; spare = null; return v; } let u=0,v=0; while(u===0) u=rng(); v=rng(); const r=Math.sqrt(-2*Math.log(u)); spare = r*Math.sin(2*Math.PI*v); return r*Math.cos(2*Math.PI*v); }; }
function invNorm(p){ // Acklam
  p = Math.min(Math.max(p, 1e-6), 1-1e-6);
  const a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.357751867269,-30.66479806614716,2.506628277459239],
        b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572],
        c=[-0.007784894002430293,-0.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783],
        d=[0.007784695709041462,0.3224671290700398,2.445134137142996,3.754408661907416];
  const pl=0.02425; let q,r;
  if (p<pl){ q=Math.sqrt(-2*Math.log(p)); return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  if (p>1-pl){ q=Math.sqrt(-2*Math.log(1-p)); return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  q=p-0.5; r=q*q; return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}
function quantile(sorted, p){ if (!sorted.length) return 0; const x=(sorted.length-1)*p, lo=Math.floor(x), hi=Math.ceil(x); return sorted[lo] + (sorted[hi]-sorted[lo])*(x-lo); }

/* ---------- Absatz ---------- */
function seasonWeights(s){ const w = s.season.map(v => Math.max(0, +v||0)); const avg = w.reduce((a,b)=>a+b,0)/12 || 1; return w.map(v => v/avg); }
function baseDemand(s){
  const H = s.years*12, w = seasonWeights(s), out = new Array(H).fill(0);
  const avg = s.annual.map(v => (+v||0)/12);
  for (let yi=0; yi<s.years; yi++){
    const raw = [];
    for (let k=0; k<12; k++){
      const i = yi*12+k; let lvl = avg[yi];
      if (s.smoothing && s.years > 1){
        // lineare Interpolation zwischen Jahresmitten → fließender Übergang über den Jahreswechsel
        const t = i - 5.5, a = Math.floor(t/12), f = (t - a*12)/12;
        const v0 = avg[Math.min(Math.max(a,0), s.years-1)], v1 = avg[Math.min(Math.max(a+1,0), s.years-1)];
        lvl = Math.max(0, v0 + (v1-v0)*f);
      }
      raw.push(lvl * w[idxDate(s,i).m-1]);
    }
    const sum = raw.reduce((a,b)=>a+b,0), target = +s.annual[yi]||0;
    for (let k=0; k<12; k++) out[yi*12+k] = sum > 0 ? raw[k]*target/sum : 0;
  }
  return out;
}
function finalDemand(s, base){
  return base.map((v,i) => { const k = idxKey(s,i); return (k in s.overrides) ? Math.max(0, +s.overrides[k]||0) : v; });
}

/* ---------- Anlagenkapazität ---------- */
function makeTypeCtx(s, t, H){
  const n = PRE + H, rb = new Float64Array(n), sb = new Float64Array(n);
  const rate = (+t.uph||0) * (+t.oee||0)/100;
  for (let j=0; j<n; j++){
    const d = idxDate(s, j-PRE);
    rb[j] = workdays(s, d.y, d.m, Math.min(7,Math.max(1,+t.rampDays||5))) * (+t.rampShifts||0) * (+t.rampHours||0) * rate;
    sb[j] = workdays(s, d.y, d.m, Math.min(7,Math.max(1,+t.days||5)))     * (+t.shifts||0)     * (+t.hours||0)     * rate;
  }
  const rm = Math.max(0, Math.round(+t.rampMonths||0)), rs = Math.min(1, Math.max(0, (+t.rampStart||0)/100));
  const cache = new Map();
  function factor(age){ return age < 0 ? 0 : (age < rm ? rs + (1-rs)*age/rm : 1); }
  function capArr(sop){
    if (cache.has(sop)) return cache.get(sop);
    const a = new Float64Array(H);
    for (let i=0; i<H; i++){ const age = i - sop; if (age < 0) continue; a[i] = age < rm ? rb[i+PRE]*factor(age) : sb[i+PRE]; }
    cache.set(sop, a); return a;
  }
  function phase(sop, i){ const age = i - sop; return age < 0 ? 0 : (age < rm ? 1 : 2); }  // 0 aus, 1 Ramp-up, 2 Serie
  const share = Math.max(0, (+t.share||0)/100);
  return { t, rm, rs, rb, sb, capArr, phase, factor, share, serialAt:i => sb[i+PRE], rampAt:i => rb[i+PRE] };
}

function stockTargets(dem, months){
  return dem.map((_,i) => { let a=0,n=0; for (let k=i+1; k<=i+3 && k<dem.length; k++){ a+=dem[k]; n++; } return n ? a/n*months : dem[i]*months; });
}
function flow(cap, dem, target, start){
  let st = start, first = -1; const H = dem.length, prod = new Float64Array(H), stock = new Float64Array(H);
  for (let i=0; i<H; i++){
    const need = Math.max(0, dem[i] + (target ? target[i] : 0) - st);
    const p = Math.min(cap[i], need); st += p - dem[i];
    prod[i] = p; stock[i] = st; if (st < -1e-6 && first < 0) first = i;
  }
  return { prod, stock, first };
}
function addArr(a,b){ const r = new Float64Array(a.length); for (let i=0;i<a.length;i++) r[i]=a[i]+b[i]; return r; }

function planClassic(T, dem){
  const H = dem.length, sops = []; let fleet = new Float64Array(H), guard = 0;
  for (let i=0; i<H; i++){
    while (fleet[i] < dem[i]-1e-6 && guard++ < 500){
      const sop = Math.max(i - T.rm, -PRE), c = T.capArr(sop);
      if (c[i] <= 0) { guard = 1e9; break; }
      sops.push(sop); fleet = addArr(fleet, c);
    }
  }
  return sops.sort((a,b)=>a-b);
}
function planHeuristic(T, dem, months, start){
  const H = dem.length, target = stockTargets(dem, months), sops = [];
  let fleet = new Float64Array(H), guard = 0;
  while (guard++ < 500){
    const r = flow(fleet, dem, target, start);
    if (r.first < 0) break;
    const i = r.first; let chosen = null;
    for (let sop=i; sop >= -T.rm && sop > -PRE; sop--){          // so spät wie möglich
      const c = T.capArr(sop); const r2 = flow(addArr(fleet,c), dem, target, start);
      if (r2.first < 0 || r2.first > i){ chosen = sop; break; }
    }
    if (chosen === null) chosen = Math.max(-T.rm, -PRE);
    const c = T.capArr(chosen);
    if (c.reduce((a,b)=>a+b,0) <= 0) break;
    sops.push(chosen); fleet = addArr(fleet, c);
  }
  return sops.sort((a,b)=>a-b);
}
function robustFactor(s){ const z = invNorm((+s.serviceLevel||95)/100); const cv = Math.sqrt(Math.pow(+s.demandCV||0,2) + Math.pow(+s.oeeCV||0,2))/100; return { z, cv, f: 1 + Math.max(0,z)*cv }; }

function planFor(method, s, T, dem){
  if (method === 'heuristic') return planHeuristic(T, dem, +s.maxStockMonths||0, (+s.startStock||0)*T.share);
  if (method === 'robust'){ const rf = robustFactor(s); return planClassic(T, dem.map(v=>v*rf.f)); }
  return planClassic(T, dem);
}
function productTarget(method, s, demand){
  if (method === 'heuristic') return stockTargets(demand, +s.maxStockMonths||0);
  if (method === 'robust'){ const rf = robustFactor(s); return demand.map(v => Math.max(0,rf.z)*rf.cv*v); }
  return null;
}

/* Produktebene: Jeder Anlagentyp hat einen eigenen Teilepuffer; lieferbar ist das Minimum über alle Typen */
function productFlow(types, demand, s){
  const H = demand.length, prod = new Float64Array(H), stock = new Float64Array(H);
  const act = types.filter(x => x.T.share > 0);
  for (let i=0;i<H;i++){
    if (!act.length){ prod[i] = 0; stock[i] = (+s.startStock||0) - demand.slice(0,i+1).reduce((a,b)=>a+b,0); continue; }
    let p = Infinity, st = Infinity;
    act.forEach(x => { p = Math.min(p, x.prod[i]/x.T.share); st = Math.min(st, x.stock[i]/x.T.share); });
    prod[i] = p; stock[i] = st;
  }
  return { prod, stock };
}
/* Kennzahlen aus Flussrechnung */
function flowStats(dem, fl){
  let D=0, short=0, stockSum=0, maxBack=0, shortMonths=0;
  for (let i=0;i<dem.length;i++){ D+=dem[i]; const st=fl.stock[i]; if (st<0){ short+=Math.min(dem[i],-st); shortMonths++; maxBack=Math.max(maxBack,-st);} else stockSum+=st; }
  return { fill: D>0 ? 1-short/D : 1, avgStock: stockSum/dem.length, maxBack, shortMonths, stockSum };
}

/* Belegschaft je Anlage/Monat (FTE) */
function machineFte(s, T, sop, i){
  const ph = T.phase(sop, i); if (!ph) return 0;
  const t = T.t, sh = ph===1 ? +t.rampShifts||0 : +t.shifts||0, dpw = ph===1 ? +t.rampDays||5 : +t.days||5;
  return (+t.staff||0) * sh * dpw/5 * (1 + (+s.absence||0)/100);
}

function evalPlan(s, ctxs, sopsByType, method, demand){
  const H = demand.length, types = [];
  let capB = new Float64Array(H).fill(Infinity), fte = new Float64Array(H), invest = 0, machines = 0;
  ctxs.forEach((T, ti) => {
    const sops = sopsByType[ti], d = demand.map(v=>v*T.share);
    let cap = new Float64Array(H); sops.forEach(sp => cap = addArr(cap, T.capArr(sp)));
    const tgt = productTarget(method, s, d);
    const fl = flow(cap, d, tgt, (+s.startStock||0)*T.share);
    const active = new Float64Array(H), ramp = new Float64Array(H), tf = new Float64Array(H);
    for (let i=0;i<H;i++) sops.forEach(sp => { const ph = T.phase(sp,i); if (ph){ active[i]++; if (ph===1) ramp[i]++; tf[i]+=machineFte(s,T,sp,i);} });
    for (let i=0;i<H;i++){ fte[i]+=tf[i]; if (T.share>0) capB[i] = Math.min(capB[i], cap[i]/T.share); }
    invest += sops.length * (+T.t.invest||0); machines += sops.length;
    let sc=0, sp=0; for (let i=0;i<H;i++){ sc+=cap[i]; sp+=fl.prod[i]; }
    types.push({ T, sops, d, cap, prod:fl.prod, stock:fl.stock, active, ramp, fte:tf, util: sc>0 ? sp/sc : 0, first: fl.first });
  });
  for (let i=0;i<H;i++) if (!isFinite(capB[i])) capB[i] = 0;
  const fl = productFlow(types, demand, s);
  const st = flowStats(demand, fl);
  st.stockSum = types.reduce((a,x)=>a+x.stock.reduce((b,v)=>b+Math.max(0,v),0),0);
  let fteMax = 0, fteSum = 0; for (let i=0;i<H;i++){ fteMax = Math.max(fteMax, fte[i]); fteSum += fte[i]; }
  const staffCost = fteSum/12 * (+s.staffCost||0), holding = st.stockSum * (+s.holdCost||0);
  const utils = types.filter(x=>x.cap.some(v=>v>0)).map(x=>x.util);
  return { types, capB, prod:fl.prod, stock:fl.stock, fte, invest, machines, fteMax, staffCost, holding,
           total: invest + staffCost + holding, util: utils.length ? utils.reduce((a,b)=>a+b,0)/utils.length : 0, ...st };
}

/* Effektiver Plan: Methode + manuelle Anzahl + manuelle SOPs */
function effectiveMachines(s, T, auto){
  let base = auto.slice();
  const mc = String(T.t.manual ?? '').trim();
  const isManual = mc !== '' && !isNaN(+mc);
  if (isManual){
    const n = Math.max(0, Math.round(+mc));
    if (n < base.length) base = base.slice(0, n);
    while (base.length < n) base.push(base.length ? base[base.length-1] : 0);
  }
  const ov = s.sopOverrides[T.t.id] || {};
  return base.map((sop, j) => {
    const o = ov[j]; const autoSop = sop; let src = (j < auto.length) ? 'auto' : 'zusätzlich';
    if (o){ const k = keyToIdx(s, o); if (k >= -PRE) { sop = k; src = 'manuell'; } }
    return { n:j+1, sop, autoSop, src };
  });
}

function compute(s){
  const H = s.years*12;
  const base = baseDemand(s), demand = finalDemand(s, base);
  const ctxs = s.types.map(t => makeTypeCtx(s, t, H));
  const methods = {};
  METHOD_KEYS.forEach(m => {
    const sops = ctxs.map(T => planFor(m, s, T, demand.map(v=>v*T.share)));
    methods[m] = { sops, ev: evalPlan(s, ctxs, sops, m, demand) };
  });
  const autoSops = methods[s.method].sops;
  const machines = ctxs.map((T,ti) => effectiveMachines(s, T, autoSops[ti]));
  const effSops = machines.map(ms => ms.map(x=>x.sop));
  const plan = evalPlan(s, ctxs, effSops, s.method, demand);
  plan.types.forEach((x,ti) => x.machines = machines[ti]);
  return { s, H, base, demand, ctxs, methods, plan };
}

/* ---------- Monte-Carlo-Simulation ---------- */
function simulate(M){
  const s = M.s, H = M.H, R = Math.max(50, Math.min(3000, Math.round(+s.simRuns||400)));
  const rng = mulberry32((+s.seed||1) >>> 0), N = normalGen(rng);
  const cv = (+s.demandCV||0)/100, rho = Math.min(0.98, Math.max(0, +s.demandRho||0)), oc = (+s.oeeCV||0)/100, pd = (+s.rampDelayProb||0)/100;
  const tgt = productTarget(s.method, s, M.demand);
  const D = new Float32Array(R*H), P = new Float32Array(R*H), S = new Float32Array(R*H), C = new Float32Array(R*H);
  const fills = [], yFill = Array.from({length:s.years}, ()=>[]), delays = [];
  for (let r=0; r<R; r++){
    let e = N();
    const dem = new Float64Array(H);
    for (let i=0;i<H;i++){ if (i>0) e = rho*e + Math.sqrt(1-rho*rho)*N(); dem[i] = Math.max(0, M.demand[i]*(1+cv*e)); }
    const capB = new Float64Array(H).fill(Infinity); let nDelay = 0; const tf = [];
    M.ctxs.forEach((T,ti) => {
      if (T.share <= 0) return;
      const cap = new Float64Array(H);
      M.plan.types[ti].machines.forEach(mc => {
        let dl = 0; if (rng() < pd){ dl = rng() < 0.65 ? 1 : 2; nDelay++; }
        const a = T.capArr(mc.sop + dl); for (let i=0;i<H;i++) cap[i]+=a[i];
      });
      for (let i=0;i<H;i++){ cap[i] *= Math.min(1.15, Math.max(0.55, 1 + oc*N())); capB[i] = Math.min(capB[i], cap[i]/T.share); }
      const d = Array.from(dem, v=>v*T.share), tg = tgt ? tgt.map(v=>v*T.share) : null;
      const f = flow(cap, d, tg, (+s.startStock||0)*T.share); tf.push({ T, prod:f.prod, stock:f.stock });
    });
    for (let i=0;i<H;i++) if (!isFinite(capB[i])) capB[i]=0;
    const fl = productFlow(tf, dem, s);
    let Dt=0, sh=0; const yD = new Array(s.years).fill(0), ySh = new Array(s.years).fill(0);
    for (let i=0;i<H;i++){
      const o = r*H+i; D[o]=dem[i]; P[o]=fl.prod[i]; S[o]=fl.stock[i]; C[o]=capB[i];
      const short = fl.stock[i] < 0 ? Math.min(dem[i], -fl.stock[i]) : 0;
      Dt+=dem[i]; sh+=short; yD[Math.floor(i/12)]+=dem[i]; ySh[Math.floor(i/12)]+=short;
    }
    fills.push(Dt>0 ? 1-sh/Dt : 1); yD.forEach((d,y)=>yFill[y].push(d>0 ? 1-ySh[y]/d : 1)); delays.push(nDelay);
  }
  const q = (arr) => { const lo=[], md=[], hi=[]; const col = new Float64Array(R);
    for (let i=0;i<H;i++){ for (let r=0;r<R;r++) col[r]=arr[r*H+i]; const so = Array.from(col).sort((a,b)=>a-b); lo.push(quantile(so,.1)); md.push(quantile(so,.5)); hi.push(quantile(so,.9)); }
    return { lo, md, hi }; };
  const pShort = []; for (let i=0;i<H;i++){ let c=0; for (let r=0;r<R;r++) if (S[r*H+i] < -1e-6) c++; pShort.push(c/R); }
  let anyShort = 0; for (let r=0;r<R;r++){ for (let i=0;i<H;i++) if (S[r*H+i] < -1e-6){ anyShort++; break; } }
  fills.sort((a,b)=>a-b); yFill.forEach(a=>a.sort((x,y)=>x-y));
  return { R, D:q(D), P:q(P), S:q(S), C:q(C), pShort, pAny:anyShort/R, fills, yFill,
           avgDelays: delays.reduce((a,b)=>a+b,0)/R };
}
/* =====================================================================
   Diagramme (SVG, ohne Fremdbibliothek)
   ===================================================================== */
const NF0 = new Intl.NumberFormat('de-DE', { maximumFractionDigits:0 });
const NF1 = new Intl.NumberFormat('de-DE', { minimumFractionDigits:1, maximumFractionDigits:1 });
const NF2 = new Intl.NumberFormat('de-DE', { minimumFractionDigits:2, maximumFractionDigits:2 });
const fmt0 = v => NF0.format(Math.round(v||0));
const fmt1 = v => NF1.format(v||0);
const fmtPct = v => NF1.format((v||0)*100) + ' %';
function fmtShort(v){ const a = Math.abs(v); if (a >= 1e9) return NF1.format(v/1e9)+' Mrd'; if (a >= 1e6) return NF1.format(v/1e6)+' Mio'; if (a >= 1e4) return NF0.format(v/1e3)+' Tsd'; if (a >= 1e3) return NF1.format(v/1e3)+' Tsd'; return NF0.format(v); }
const fmtEur = v => fmtShort(v) + ' €';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const hiddenSeries = {};

function niceTicks(min, max, count){
  if (max === min){ max = min + 1; }
  const span = max - min, step0 = span / count, mag = Math.pow(10, Math.floor(Math.log10(step0))), err = step0/mag;
  const step = (err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1) * mag;
  const lo = Math.floor(min/step)*step, hi = Math.ceil(max/step)*step, t = [];
  for (let v = lo; v <= hi + step*1e-6; v += step) t.push(+v.toFixed(10));
  return t;
}
function roundTopRect(x, y0, w, y1, r){ // Balken von y0 (Basis) nach y1, gerundetes Datenende
  const up = y1 < y0, h = Math.abs(y1-y0); r = Math.min(r, w/2, h);
  if (h < 0.5) return '';
  if (up) return `M${x},${y0}V${y1+r}Q${x},${y1} ${x+r},${y1}H${x+w-r}Q${x+w},${y1} ${x+w},${y1+r}V${y0}Z`;
  return `M${x},${y0}V${y1-r}Q${x},${y1} ${x+r},${y1}H${x+w-r}Q${x+w},${y1} ${x+w},${y1-r}V${y0}Z`;
}

/* cfg: { id, labels[], tipLabels[], series:[{name,color,values,kind:'line'|'bar'|'step'|'area',dash,fmt}],
          stacked, band:{lo,hi,color,name}, height, yFmt, yearStarts[], ref:{value,label}, yMin } */
function renderChart(el, cfg){
  if (!el) return;
  const hid = hiddenSeries[cfg.id] || (hiddenSeries[cfg.id] = new Set());
  const series = cfg.series.filter(s => !hid.has(s.name));
  const W = Math.max(280, el.clientWidth || 600), Hh = cfg.height || 260;
  const m = { l:58, r:14, t:12, b:26 }, iw = W - m.l - m.r, ih = Hh - m.t - m.b;
  const n = cfg.labels.length, step = iw / Math.max(1,n), xc = i => m.l + step*(i+0.5);
  const yFmt = cfg.yFmt || fmtShort;
  // Wertebereich
  let lo = cfg.yMin ?? 0, hi = 0;
  const bars = series.filter(s => s.kind === 'bar');
  if (cfg.stacked){
    for (let i=0;i<n;i++){ let p=0,q=0; bars.forEach(s => { const v=s.values[i]||0; if (v>=0) p+=v; else q+=v; }); hi=Math.max(hi,p); lo=Math.min(lo,q); }
    series.filter(s=>s.kind!=='bar').forEach(s => s.values.forEach(v => { if (v!=null){ hi=Math.max(hi,v); lo=Math.min(lo,v);} }));
  } else series.forEach(s => s.values.forEach(v => { if (v!=null && isFinite(v)){ hi=Math.max(hi,v); lo=Math.min(lo,v);} }));
  if (cfg.band && !hid.has(cfg.band.name)) { cfg.band.hi.forEach(v=>hi=Math.max(hi,v)); cfg.band.lo.forEach(v=>lo=Math.min(lo,v)); }
  if (cfg.ref) hi = Math.max(hi, cfg.ref.value);
  if (hi - lo < 1e-9) hi = lo + 10;
  const ticks = niceTicks(lo, hi, 4), y0 = ticks[0], y1 = ticks[ticks.length-1];
  const y = v => m.t + ih - (v - y0)/(y1 - y0)*ih;
  let svg = `<svg viewBox="0 0 ${W} ${Hh}" height="${Hh}" role="img" aria-label="${esc(cfg.title||'Diagramm')}">`;
  // Raster
  ticks.forEach(t => { svg += `<line x1="${m.l}" x2="${W-m.r}" y1="${y(t)}" y2="${y(t)}" stroke="${t===0?'var(--axis)':'var(--grid)'}" stroke-width="1"/>`
    + `<text x="${m.l-8}" y="${y(t)+3.5}" text-anchor="end">${esc(yFmt(t))}</text>`; });
  // Jahrestrennung & x-Achse
  const ys = cfg.yearStarts || [];
  ys.forEach(i => { if (i>0) svg += `<line x1="${m.l+step*i}" x2="${m.l+step*i}" y1="${m.t}" y2="${m.t+ih}" stroke="var(--grid)" stroke-dasharray="3 3"/>`; });
  const every = n <= 14 ? 1 : n <= 28 ? 2 : 0;
  if (every) cfg.labels.forEach((l,i) => { if (i % every === 0) svg += `<text x="${xc(i)}" y="${Hh-8}" text-anchor="middle">${esc(l)}</text>`; });
  else ys.forEach((i,k) => { const end = ys[k+1] ?? n; svg += `<text x="${m.l+step*(i+end)/2}" y="${Hh-8}" text-anchor="middle">${esc(cfg.yearLabels ? cfg.yearLabels[k] : cfg.labels[i])}</text>`; });
  // Band
  if (cfg.band && !hid.has(cfg.band.name)){
    let p = ''; cfg.band.hi.forEach((v,i)=> p += (i?'L':'M') + xc(i) + ',' + y(v));
    for (let i=n-1;i>=0;i--) p += 'L' + xc(i) + ',' + y(cfg.band.lo[i]);
    svg += `<path d="${p}Z" fill="${cfg.band.color}" opacity=".16"/>`;
  }
  // Balken
  if (bars.length){
    const gw = Math.max(1, step*0.72), gap = bars.length>1 && !cfg.stacked ? Math.min(2, gw*0.08) : 0;
    const bw = cfg.stacked ? gw : (gw - gap*(bars.length-1))/bars.length;
    for (let i=0;i<n;i++){
      let pos = 0, neg = 0;
      bars.forEach((s,k) => {
        const v = s.values[i] || 0; if (!v) return;
        let x, b, t;
        if (cfg.stacked){ x = xc(i)-gw/2; if (v>=0){ b = y(pos); pos+=v; t = y(pos); } else { b = y(neg); neg+=v; t = y(neg); }
          // 2px Abstand zwischen gestapelten Segmenten
          if (k>0 && Math.abs(b-t)>3) b += (v>=0?-1:1)*1; }
        else { x = xc(i)-gw/2 + k*(bw+gap); b = y(Math.max(y0,Math.min(0,y1))); t = y(v); }
        svg += `<path d="${roundTopRect(x, b, bw, t, Math.min(4, bw/3))}" fill="${s.color}"/>`;
      });
    }
  }
  // Linien
  series.filter(s => s.kind !== 'bar').forEach(s => {
    let d = '', started = false;
    s.values.forEach((v,i) => {
      if (v == null || !isFinite(v)){ started = false; return; }
      if (s.kind === 'step'){ const xl = m.l+step*i, xr = m.l+step*(i+1); d += (started ? 'L' : 'M') + xl + ',' + y(v) + 'L' + xr + ',' + y(v); }
      else d += (started ? 'L' : 'M') + xc(i) + ',' + y(v);
      started = true;
    });
    if (s.kind === 'area'){
      const base = y(Math.max(y0, Math.min(0, y1)));
      svg += `<path d="${d}L${xc(n-1)},${base}L${xc(0)},${base}Z" fill="${s.color}" opacity=".14"/>`;
    }
    svg += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="5 4"':''}/>`;
    if (n <= 14 && s.kind !== 'step') s.values.forEach((v,i) => { if (v!=null) svg += `<circle cx="${xc(i)}" cy="${y(v)}" r="3.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`; });
  });
  if (cfg.ref){ svg += `<line x1="${m.l}" x2="${W-m.r}" y1="${y(cfg.ref.value)}" y2="${y(cfg.ref.value)}" stroke="var(--text-2)" stroke-dasharray="2 4"/>`
    + `<text x="${W-m.r}" y="${y(cfg.ref.value)-5}" text-anchor="end" style="fill:var(--text-2)">${esc(cfg.ref.label)}</text>`; }
  svg += `<line class="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" stroke="var(--text-2)" stroke-width="1" opacity="0"/>`;
  svg += `<rect class="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  // Legende
  let leg = '';
  if (cfg.series.length + (cfg.band?1:0) > 1 && !cfg.noLegend){
    leg = '<div class="legend">' + cfg.series.map(s => `<button data-s="${esc(s.name)}" class="${hid.has(s.name)?'off':''}"><span class="sw ${s.kind==='bar'?'bar':''}" style="background:${s.color}${s.dash?';background:repeating-linear-gradient(90deg,'+s.color+' 0 4px,transparent 4px 7px)':''}"></span>${esc(s.name)}</button>`).join('')
      + (cfg.band ? `<button data-s="${esc(cfg.band.name)}" class="${hid.has(cfg.band.name)?'off':''}"><span class="sw bar" style="background:${cfg.band.color};opacity:.35"></span>${esc(cfg.band.name)}</button>` : '') + '</div>';
  }
  el.innerHTML = leg + '<div class="chart">' + svg + '<div class="tip"></div></div>';
  el.querySelectorAll('.legend button').forEach(b => b.onclick = () => { const k=b.dataset.s; hid.has(k)?hid.delete(k):hid.add(k); renderChart(el, cfg); });
  // Hover
  const box = el.querySelector('.chart'), sv = box.querySelector('svg'), tip = box.querySelector('.tip'), xh = sv.querySelector('.xh');
  const move = ev => {
    const r = sv.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    const i = Math.max(0, Math.min(n-1, Math.floor((px - m.l)/step)));
    xh.setAttribute('x1', xc(i)); xh.setAttribute('x2', xc(i)); xh.setAttribute('opacity', '.35');
    let h = `<div class="h">${esc((cfg.tipLabels||cfg.labels)[i])}</div>`;
    series.forEach(s => { const v = s.values[i]; if (v==null) return; h += `<div class="r"><span><i class="dot" style="background:${s.color}"></i>${esc(s.name)}</span><b>${esc((s.fmt||cfg.tipFmt||fmt0)(v))}</b></div>`; });
    if (cfg.band && !hid.has(cfg.band.name)) h += `<div class="r"><span><i class="dot" style="background:${cfg.band.color};opacity:.5"></i>${esc(cfg.band.name)}</span><b>${esc((cfg.tipFmt||fmt0)(cfg.band.lo[i]))} – ${esc((cfg.tipFmt||fmt0)(cfg.band.hi[i]))}</b></div>`;
    tip.innerHTML = h; tip.style.opacity = 1;
    const bx = box.getBoundingClientRect(), tx = xc(i) * r.width / W;
    const tw = tip.offsetWidth; tip.style.left = Math.max(0, Math.min(bx.width - tw, tx + 14 > bx.width - tw ? tx - tw - 14 : tx + 14)) + 'px';
    tip.style.top = Math.max(0, (ev.clientY - bx.top) - 30) + 'px';
  };
  sv.addEventListener('mousemove', move);
  sv.addEventListener('mouseleave', () => { tip.style.opacity = 0; xh.setAttribute('opacity', 0); });
}

/* Aggregation Monat → Jahr */
function aggYear(values, mode, years){
  const out = [];
  for (let y=0; y<years; y++){
    const sl = Array.from(values).slice(y*12, y*12+12);
    if (mode === 'sum') out.push(sl.reduce((a,b)=>a+b,0));
    else if (mode === 'last') out.push(sl[11]);
    else if (mode === 'max') out.push(Math.max(...sl));
    else out.push(sl.reduce((a,b)=>a+b,0)/12);
  }
  return out;
}

    <div style="margin:-6px 0 14px"><button class="btn primary sm" data-act="add-type" ${s.types.length>=8?'disabled':''}>＋ Anlagentyp hinzufügen</button></div>
    <div class="tbl-wrap"><table class="tbl param-tbl"><thead><tr><th class="sticky">Parameter</th>
      ${s.types.map((t,ti)=>`<th class="type-h"><div class="type-head"><span class="dot" style="background:${col(t.slot)}"></span><input class="cell l" data-k="types.${ti}.name" value="${esc(t.name)}" aria-label="Name Anlagentyp"><button class="xbtn" data-del-type="${ti}" title="Anlagentyp entfernen" aria-label="Anlagentyp entfernen">✕</button></div></th>`).join('')}
    </tr></thead><tbody>
      ${rows.map(r => r.length===1 ? `<tr class="grp"><td class="sticky" colspan="${s.types.length+1}">${r[0]}</td></tr>` :
        `<tr><td class="sticky">${r[0]} ${r[2]?`<span class="muted">(${r[2]})</span>`:''}</td>${s.types.map((t,ti)=>`<td><input class="cell" type="number" ${r[1]==='manual'?'placeholder="auto: '+(M.methods[s.method].sops[ti]||[]).length+'"':''} step="${r[3]}" min="0" data-k="types.${ti}.${r[1]}" value="${esc(t[r[1]])}"></td>`).join('')}</tr>`).join('')}
      <tr class="grp"><td class="sticky" colspan="${s.types.length+1}">Abgeleitet</td></tr>
      <tr><td class="sticky">Ø Kapazität je Anlage/Monat – Serie</td>${M.ctxs.map(T=>`<td class="n">${fmt0(avgCap(T,false))}</td>`).join('')}</tr>
      <tr><td class="sticky">Ø Kapazität je Anlage/Monat – Ramp-up (100 %)</td>${M.ctxs.map(T=>`<td class="n">${fmt0(avgCap(T,true))}</td>`).join('')}</tr>
      <tr><td class="sticky">Personal je Anlage in Serie (FTE inkl. Zuschlag)</td>${M.ctxs.map(T=>`<td class="n">${fmt1(machineFte(s,T,-999,0))}</td>`).join('')}</tr>
      <tr><td class="sticky">Bedarf je Monat (Ø)</td>${M.ctxs.map(T=>`<td class="n">${fmt0(M.demand.reduce((a,b)=>a+b,0)/H*T.share)}</td>`).join('')}</tr>
    </tbody></table></div>
  </section>`;

  // 4 Kalender & Personal
  h += `<section class="card">${sectionTitle(4,'Kalender, Personal & Kosten','Arbeitstage werden je Monat aus dem echten Kalender gezählt (Mo–Fr, Mo–Sa …) und um Feiertage und Betriebsurlaub reduziert.')}
    <div class="fields">
      ${field('Feiertage pro Jahr','holidays',{unit:'Tage',min:0})}
      ${field('Betriebsurlaub','vacDays',{unit:'AT',min:0})}
      <div class="field"><label>Monat des Betriebsurlaubs</label><select class="inp" data-k="vacMonth"><option value="0">keiner</option>${MON_L.map((n,i)=>`<option value="${i+1}" ${+s.vacMonth===i+1?'selected':''}>${n}</option>`).join('')}</select></div>
      ${field('Personalzuschlag (Urlaub/Krankheit)','absence',{unit:'%',min:0,hint:'FTE = MA × Schichten × Tage/5 × (1 + Zuschlag)'})}
      ${field('Personalkosten je FTE','staffCost',{unit:'€/J',step:1000,min:0})}
      ${field('Lagerkosten','holdCost',{unit:'€/Stk·M',step:0.05,min:0})}
      ${field('Anfangsbestand','startStock',{unit:'Stk',min:0,step:1000})}
    </div>
  </section>`;

  // 5 Methode
  h += `<section class="card">${sectionTitle(5,'Planungsmethode','Alle drei Methoden werden immer gerechnet und auf Blatt 4 verglichen. Die gewählte Methode steuert Zeitplan, Simulation und Grafiken.')}
    <div class="method-cards">${METHOD_KEYS.map(k=>{const ev=M.methods[k].ev; return `<button class="mcard" data-method="${k}" aria-pressed="${s.method===k}">
      <h3>${METHODS[k].name}<span class="pill ${s.method===k?'accent':''}">${ev.machines} Anlagen</span></h3><p>${METHODS[k].desc}</p></button>`}).join('')}</div>
    <div class="fields" style="margin-top:16px">
      ${field('Max. Lagerreichweite (Heuristik)','maxStockMonths',{unit:'Monate',step:0.25,min:0})}
      ${field('Servicegrad (Robust)','serviceLevel',{unit:'%',step:0.5,min:50,max:99.9})}
    </div>
  </section>`;

  // 6 Simulation
  h += `<section class="card">${sectionTitle(6,'Simulation','Parameter für die Monte-Carlo-Simulation auf Blatt 6. Die Absatzschwankung ist autokorreliert und läuft ohne Bruch über den Jahreswechsel.')}
    <div class="fields">
      ${field('Absatzschwankung (Variationskoeff.)','demandCV',{unit:'%',step:0.5,min:0})}
      ${field('Autokorrelation Monat zu Monat','demandRho',{step:0.05,min:0,max:0.98,hint:'0 = unabhängig, 0,9 = sehr träge'})}
      ${field('OEE-Schwankung','oeeCV',{unit:'%',step:0.5,min:0})}
      ${field('Wahrscheinlichkeit Ramp-up-Verzug','rampDelayProb',{unit:'%',min:0,max:100,hint:'je Anlage, 1–2 Monate'})}
      ${field('Simulationsläufe','simRuns',{min:50,max:3000,step:50})}
      ${field('Startwert Zufallsgenerator','seed',{min:1})}
    </div>
  </section>`;
  return h;
}

function kpiTiles(){
  const p = M.plan, tot = p.types.reduce((a,x)=>a+x.machines.length,0);
  const shortTxt = p.shortMonths ? `<span style="color:var(--crit)">${p.shortMonths} Monat(e) mit Fehlmenge</span>` : 'ohne Fehlmenge';
  return `<div class="kpis">
    <div class="kpi"><div class="l">Anlagen gesamt</div><div class="v">${tot}</div><div class="s">${p.types.map(x=>x.machines.length+'× '+esc(x.T.t.name)).join(' · ')||'–'}</div></div>
    <div class="kpi"><div class="l">Absatz im Horizont</div><div class="v">${fmtShort(M.demand.reduce((a,b)=>a+b,0))}</div><div class="s">Stück über ${S.years} Jahr(e)</div></div>
    <div class="kpi"><div class="l">Lieferfähigkeit (Plan)</div><div class="v">${fmtPct(p.fill)}</div><div class="s">${shortTxt}</div></div>
    <div class="kpi"><div class="l">Personal in der Spitze</div><div class="v">${fmt1(p.fteMax)}</div><div class="s">FTE inkl. ${S.absence} % Zuschlag</div></div>
    <div class="kpi"><div class="l">Investition</div><div class="v">${fmtEur(p.invest)}</div><div class="s">Ø Auslastung ${fmtPct(p.util)}</div></div>
  </div>`;
}
function planBanner(){
  const p = M.plan, bad = p.types.filter(x => x.first >= 0);
  if (!bad.length) return '';
  return `<div class="banner warn"><span>⚠︎</span><div><b>Kapazitätslücke im Plan.</b> ${bad.map(x=>`${esc(x.T.t.name)} ab ${esc(monthLabel(S,x.first,true))}`).join(' · ')} – Anzahl oder SOP auf Blatt 4 prüfen.</div></div>`;
}
function pageOverview(){
  const s = S, H = M.H, p = M.plan;
  let h = kpiTiles() + planBanner();
  h += `<div class="card"><div class="card-h"><div><h2>Absatz und Output je Jahr</h2><p>Jahressummen · Kapazität = Engpass über alle Anlagentypen</p></div></div><div id="ch-ov"></div></div>`;
  h += `<div class="card"><div class="card-h"><div><h2>Vereinfachte Kapazitätsrechnung</h2><p>Statisch je Jahr, ohne Ramp-up und Lager – zur Plausibilisierung neben dem Monatsplan (${METHODS[s.method].name}).</p></div></div>
    <div class="formula">Anlagen rechnerisch = Jahresbedarf × Bedarfsanteil ÷ (Arbeitstage × Schichten × Std./Schicht × Stk/h × OEE)</div><div style="height:14px"></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th class="sticky">Kennzahl</th>${yearLabels().map(l=>`<th class="n">${esc(l)}</th>`).join('')}</tr></thead><tbody>`;
  p.types.forEach((x,ti) => {
    const T = x.T, t = T.t;
    const dem = aggYear(x.d,'sum',s.years), wd = Array.from({length:s.years},(_,y)=>{let a=0; for(let k=0;k<12;k++){const d=idxDate(s,y*12+k); a+=workdays(s,d.y,d.m,+t.days||5);} return a;});
    const capY = Array.from({length:s.years},(_,y)=>{let a=0; for(let k=0;k<12;k++) a+=T.serialAt(y*12+k); return a;});
    const raw = dem.map((d,y)=>capY[y]>0 ? d/capY[y] : 0);
    const endM = aggYear(x.active,'last',s.years), utilY = Array.from({length:s.years},(_,y)=>{let c=0,pp=0; for(let k=0;k<12;k++){c+=x.cap[y*12+k]; pp+=x.prod[y*12+k];} return c>0?pp/c:0;});
    const fte = aggYear(x.fte,'avg',s.years);
    h += `<tr class="grp"><td class="sticky" colspan="${s.years+1}"><span class="dot" style="background:${col(t.slot)};margin-right:8px"></span>${esc(t.name)}</td></tr>`;
    const row = (l, arr, f, cls) => `<tr class="${cls||''}"><td class="sticky">${l}</td>${arr.map(v=>`<td class="n">${typeof v==='string'?v:f(v)}</td>`).join('')}</tr>`;
    h += row('Bedarf (Stk)', dem, fmt0);
    h += row('Arbeitstage Serie', wd, fmt1);
    h += row('Kapazität je Anlage/Jahr', capY, fmt0);
    h += row('Anlagen rechnerisch', raw, v=>NF2.format(v));
    h += row('Anlagen aufgerundet', raw.map(v=>Math.ceil(v-1e-9)), fmt0);
    h += row(`Anlagen Plan (Jahresende)`, endM.map((v,y)=>{const r=Math.ceil(raw[y]-1e-9); return `<b>${fmt0(v)}</b>${v<r?' <span class="pill crit">−'+(r-v)+'</span>':''}`;}), fmt0, 'total');
    h += row('Auslastung Plan', utilY, fmtPct);
    h += row('Personal Ø (FTE)', fte, fmt1);
  });
  h += `<tr class="grp"><td class="sticky" colspan="${s.years+1}">Gesamt</td></tr>`;
  const fteY = aggYear(p.fte,'max',s.years), invY = Array.from({length:s.years},(_,y)=>p.types.reduce((a,x)=>a+x.machines.filter(mc=>Math.max(0,mc.sop)>=y*12 && Math.max(0,mc.sop)<y*12+12).length*(+x.T.t.invest||0),0));
  h += `<tr><td class="sticky">Personal Spitze (FTE)</td>${fteY.map(v=>`<td class="n">${fmt1(v)}</td>`).join('')}</tr>`;
  h += `<tr><td class="sticky">Investition (nach SOP-Jahr)</td>${invY.map((v,y)=>`<td class="n">${fmtEur(v + (y===0? p.types.reduce((a,x)=>a+x.machines.filter(mc=>mc.sop<0).length*(+x.T.t.invest||0),0):0))}</td>`).join('')}</tr>`;
  h += `</tbody></table></div><p class="small muted" style="margin:10px 0 0">Investitionen mit SOP vor Planungsbeginn sind dem ersten Jahr zugeordnet.</p></div>`;
  return h;
}

      <td class="n ${dlt==null?'':''}">${dlt==null?'–':(dlt>=0?'+':'')+fmt1(dlt)+' %'}</td>
      <td class="n">${fmt0(p.capB[i])}</td><td class="n">${fmt0(p.prod[i])}</td>

    <div class="tbl-wrap"><table class="tbl"><thead><tr><th class="sticky">Monat</th><th class="n">Arbeitstage</th><th class="n">Absatz</th><th class="n">Δ Vormonat</th><th class="n">Kapazität</th><th class="n">Produktion</th><th class="n">Bestand</th>${tcols}<th class="n">Personal FTE</th></tr></thead><tbody>
    ${y>0 ? row(y*12-1, true) : ''}

    </tbody></table></div></div>`;
  return h;
}

    x.machines.forEach((mc,j) => {

function renderTabs(){
  document.getElementById('tabs').innerHTML = PAGES.map(([k,l],i)=>`<button role="tab" data-page="${k}" aria-pressed="${ui.page===k}"><span class="k">${i+1}</span>${l}</button>`).join('');

function render(anim){
  renderTabs();

  const app = document.getElementById('app');
  app.innerHTML = `<div class="${anim?'fade':''}"><div class="hero"><div><div class="eyebrow">${eb}</div><h1>${title}</h1><p class="lede">${lede}</p></div>
    <div class="no-print" style="display:flex;gap:8px;align-items:center"><span class="pill accent">${METHODS[S.method].name}</span><span class="pill">${S.yearMode==='calendar'?'Kalenderjahr':'Geschäftsjahr ab '+MON_L[startMonth(S)-1]}</span></div></div>${fn()}</div>`;
  if (after) after();
}
function focusSig(el){ if (!el || !el.dataset) return null; for (const a of ['k','ov','sop']) if (el.dataset[a] != null) return `[data-${a}="${el.dataset[a]}"]`; return null; }
function commit(msg){
  save(); recompute();
  setTimeout(() => {
    const sig = focusSig(document.activeElement), sy = window.scrollY;
    render(false); window.scrollTo(0, sy);
    if (sig){ const el = document.querySelector(sig); if (el){ el.focus({preventScroll:true}); if (el.select && el.type!=='checkbox' && el.tagName==='INPUT') try{ el.select(); }catch(e){} } }
    if (msg) toast(msg);
  }, 0);
}
function onChange(e){
  const el = e.target, d = el.dataset;
  if (d.k != null){
    let v;
    if (el.type === 'checkbox') v = el.checked;
    else if (el.type === 'number') v = el.value === '' ? '' : +el.value;
    else v = el.value;
    const path = d.k;
    if (path.endsWith('.manual')) v = el.value === '' ? '' : Math.max(0, Math.round(+el.value));
    else if (el.type === 'number' && v === '') v = 0;
    if (['fiscalStart','vacMonth'].includes(path)) v = +v;
    setPath(S, path, v);
    if (path === 'years' || path === 'startYear'){ S.startYear = Math.max(2000, Math.min(2100, Math.round(+S.startYear||2027))); normalize(S); }
    if (path === 'fiscalStart' || path === 'startYear' || path === 'years') ui.monthYear = Math.min(ui.monthYear, S.years-1);
    commit();
  } else if (d.ov){
    if (el.value === '') delete S.overrides[d.ov]; else S.overrides[d.ov] = Math.max(0, +el.value);
    commit();
  } else if (d.sop){
    const [tid, j] = d.sop.split('|'); S.sopOverrides[tid] = S.sopOverrides[tid] || {}; S.sopOverrides[tid][j] = el.value;
    commit('SOP angepasst');
  }
}
function newType(){
  const used = new Set(S.types.map(t=>t.slot)); let slot = 1; while (used.has(slot) && slot < 8) slot++;
  return { id:'t'+Date.now().toString(36), slot, name:'Anlagentyp '+(S.types.length+1), uph:100, oee:80, share:100, staff:1, invest:500000, lead:6, install:1,
           rampMonths:3, rampStart:50, rampShifts:2, rampHours:8, rampDays:5, shifts:3, hours:8, days:5, manual:'' };
}
function onClick(e){
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.page){ ui.page = d.page; save(); render(true); window.scrollTo({top:0}); return; }
  if (d.yearmode){ S.yearMode = d.yearmode; commit(d.yearmode==='calendar'?'Kalenderjahr (Jan–Dez)':'Geschäftsjahr ab '+MON_L[startMonth(S)-1]); return; }
  if (d.method){ S.method = d.method; commit('Methode: '+METHODS[d.method].name); return; }
  if (d.myear != null){ ui.monthYear = +d.myear; save(); render(); return; }
  if (d.range != null){ ui.range = d.range; save(); render(); return; }
  if (d.gran){ if (ui.range==='all'){ ui.gran = d.gran; save(); render(); } return; }
  if (d.dkind){ ui.demandKind = d.dkind; save(); render(); return; }
  if (d.ctype != null){ ui.capType = +d.ctype; save(); render(); return; }
  if (d.delType != null){ const t = S.types[+d.delType]; if (t && confirm(`Anlagentyp „${t.name}“ entfernen?`)){ S.types.splice(+d.delType,1); delete S.sopOverrides[t.id]; commit('Anlagentyp entfernt'); } return; }
  switch (d.act){
    case 'add-type': if (S.types.length < 8){ S.types.push(newType()); commit('Anlagentyp hinzugefügt'); } break;
    case 'clear-ov': S.overrides = {}; commit('Manuelle Monatswerte entfernt'); break;
    case 'clear-sop': delete S.sopOverrides[d.type]; commit('SOPs zurückgesetzt'); break;
    case 'reseed': S.seed = Math.floor(Math.random()*99999)+1; commit('Neue Simulation mit Seed '+S.seed); break;
  }
}
function download(name, text, type){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500); }
function exportCsv(){
  const p = M.plan, nf = v => String(Math.round(v*100)/100).replace('.', ',');
  const head = ['Monat','Planungsjahr','Absatz','Kapazität Engpass','Produktion','Bestand','Personal FTE', ...p.types.flatMap(x=>[x.T.t.name+' Anlagen', x.T.t.name+' Kapazität', x.T.t.name+' Produktion'])];
  const rows = [head.join(';')];
  for (let i=0;i<M.H;i++) rows.push([idxKey(S,i), yearLabel(S,Math.floor(i/12)), nf(M.demand[i]), nf(p.capB[i]), nf(p.prod[i]), nf(p.stock[i]), nf(p.fte[i]),
    ...p.types.flatMap(x=>[x.active[i], nf(x.cap[i]), nf(x.prod[i])])].join(';'));
  download('kapazitaetsplanung-monate.csv', '﻿'+rows.join('\r\n'), 'text/csv;charset=utf-8');
}
function onMenu(act){
  document.getElementById('menu').classList.remove('open');
  if (act === 'export') download('kapazitaetsplanung.json', JSON.stringify(S, null, 2), 'application/json');
  if (act === 'import') document.getElementById('fileIn').click();
  if (act === 'csv') exportCsv();
  if (act === 'print') window.print();
  if (act === 'reset' && confirm('Alle Eingaben auf die Beispieldaten zurücksetzen?')){ S = defaultState(); commit('Beispieldaten geladen'); }
}
function applyTheme(t){ if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }

function init(){
  try { applyTheme(localStorage.getItem(LS_KEY+'.theme')); } catch(e){}
  recompute(); render(true);
  const app = document.getElementById('app');
  app.addEventListener('change', onChange);
  app.addEventListener('click', onClick);
  document.getElementById('tabs').addEventListener('click', onClick);
  app.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('input')) e.target.blur(); });
  document.getElementById('menuBtn').onclick = e => { e.stopPropagation(); document.getElementById('menu').classList.toggle('open'); };
  document.getElementById('menu').addEventListener('click', e => { const b = e.target.closest('button'); if (b) onMenu(b.dataset.act); });
  document.addEventListener('click', e => { if (!e.target.closest('#menu')) document.getElementById('menu').classList.remove('open'); });
  document.getElementById('fileIn').onchange = e => {
    const f = e.target.files[0]; if (!f) return; const rd = new FileReader();
    rd.onload = () => { try { const o = JSON.parse(rd.result); if (!o || o.v !== 1) throw 0; S = normalize(Object.assign(defaultState(), o)); commit('Planung importiert'); } catch(err){ toast('Datei konnte nicht gelesen werden'); } };
    rd.readAsText(f); e.target.value = '';
  };
  document.getElementById('themeBtn').onclick = () => {
    const dark = document.documentElement.getAttribute('data-theme') ? document.documentElement.getAttribute('data-theme')==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    const t = dark ? 'light' : 'dark'; applyTheme(t); try { localStorage.setItem(LS_KEY+'.theme', t); } catch(e){}
    render();
  };
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { const [,after] = RENDER[ui.page]; if (after) after(); }, 150); });
}
init();
</script>
